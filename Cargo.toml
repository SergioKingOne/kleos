[workspace]
resolver = "2"
members = [
    "crates/kleos-types",
    "crates/kleos-api-producer",
    "crates/kleos-stream-consumer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = []
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# AWS SDK
aws-config = { version = "1.1", features = ["behavior-version-latest"] }
aws-sdk-kinesis = "1.12"

# Lambda runtime
lambda_runtime = "0.13"
lambda_http = "0.13"
aws_lambda_events = { version = "0.15", default-features = false, features = ["kinesis"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP (for API Gateway Lambda)
http = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
