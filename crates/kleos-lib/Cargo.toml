[package]
name = "kleos-lib"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.83"
chrono = { version = "0.4.38", features = ["serde"] }
serde = { version = "1.0.215", features = ["derive"] }
thiserror = "2.0.3"
uuid = { version = "1.11.0", features = ["serde", "v4"] }

[[test]]
name = "unit"
path = "tests/unit/mod.rs"

[dev-dependencies]
serde_json = "1.0.145"
tokio = { version = "1.0", features = ["full"] }
