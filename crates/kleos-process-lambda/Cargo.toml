[package]
name = "kleos-process-lambda"
version = "0.1.0"
edition = "2024"

[dependencies]
lambda_runtime = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "sync"] }
async-trait = "0.1"
aws_lambda_events = { version = "0.18", default-features = false, features = [
    "kinesis",
] }
base64 = "0.21"
kleos-lib = { path = "../kleos-lib" }
kleos-ingest-lambda = { path = "../kleos-ingest-lambda" }
