AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Kleos API Layer - API Gateway REST API

Parameters:
  Environment:
    Type: String
    Description: Environment name (dev, staging, prod)
    AllowedValues:
      - dev
      - staging
      - prod
    Default: dev

Resources:
  # API Gateway REST API (raw resource - no auto-deployment)
  KleosApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub kleos-api-${Environment}
      Description: Kleos event ingestion API
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: Kleos
        - Key: ManagedBy
          Value: SAM

  # CloudWatch Log Group for API Gateway access logs
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/kleos-api-${Environment}
      RetentionInDays: 7

Outputs:
  ApiId:
    Description: API Gateway REST API ID
    Value: !Ref KleosApi
    Export:
      Name: !Sub ${AWS::StackName}-ApiId

  ApiRootResourceId:
    Description: API Gateway root resource ID
    Value: !GetAtt KleosApi.RootResourceId
    Export:
      Name: !Sub ${AWS::StackName}-RootResourceId

  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${KleosApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl

  ApiStage:
    Description: API Gateway stage name
    Value: !Ref Environment
    Export:
      Name: !Sub ${AWS::StackName}-StageName

  ApiAccessLogGroupArn:
    Description: ARN of API access log group
    Value: !GetAtt ApiAccessLogGroup.Arn
    Export:
      Name: !Sub ${AWS::StackName}-AccessLogGroupArn
