AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Kleos - Type-Driven AWS Serverless Event Streaming

# Global configuration for all Lambda functions
Globals:
  Function:
    Runtime: provided.al2023
    Architectures: [x86_64]  # Using x86_64 for local builds without Docker
    Handler: bootstrap
    Timeout: 30
    MemorySize: 256
    Tracing: Active  # AWS X-Ray tracing
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !Ref LogLevel
        RUST_BACKTRACE: '1'

# Parameters for environment-specific configuration
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARN, ERROR]
    Description: Logging level for application

  KinesisShardCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 100
    Description: Number of Kinesis shards

# Environment-specific configuration mappings
Mappings:
  EnvironmentConfig:
    dev:
      ApiThrottleRate: 100
      ApiThrottleBurst: 200
      LambdaReservedConcurrency: 0  # 0 = no reserved concurrency
      KinesisRetentionHours: 24
      LogRetentionDays: 7
    staging:
      ApiThrottleRate: 500
      ApiThrottleBurst: 1000
      LambdaReservedConcurrency: 0  # 0 = no reserved concurrency
      KinesisRetentionHours: 48
      LogRetentionDays: 14
    prod:
      ApiThrottleRate: 2000
      ApiThrottleBurst: 5000
      LambdaReservedConcurrency: 0  # 0 = no reserved concurrency
      KinesisRetentionHours: 168
      LogRetentionDays: 30

# Conditions for conditional resource creation
Conditions:
  IsProduction: !Equals [!Ref Environment, prod]
  EnableAlarms: !Or [!Equals [!Ref Environment, staging], !Condition IsProduction]

Resources:
  # ========================================
  # Kinesis Data Stream
  # ========================================
  KleosKinesisStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub kleos-stream-${Environment}
      ShardCount: !Ref KinesisShardCount
      RetentionPeriodHours: !FindInMap [EnvironmentConfig, !Ref Environment, KinesisRetentionHours]
      StreamEncryption:
        EncryptionType: KMS
        KeyId: alias/aws/kinesis
      StreamModeDetails:
        StreamMode: PROVISIONED
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: Kleos
        - Key: ManagedBy
          Value: SAM

  # ========================================
  # API Gateway HTTP API
  # ========================================
  KleosHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub kleos-api-${Environment}
      Description: Kleos event ingestion API
      DefaultRouteSettings:
        ThrottlingBurstLimit: !FindInMap [EnvironmentConfig, !Ref Environment, ApiThrottleBurst]
        ThrottlingRateLimit: !FindInMap [EnvironmentConfig, !Ref Environment, ApiThrottleRate]
      CorsConfiguration:
        AllowOrigins:
          - !If [IsProduction, "https://kleos.example.com", "*"]
        AllowMethods:
          - POST
        AllowHeaders:
          - Content-Type
        MaxAge: 300
      Tags:
        Environment: !Ref Environment
        Application: Kleos

  # ========================================
  # Producer Lambda (API Gateway -> Kinesis)
  # ========================================
  KleosApiProducer:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub kleos-api-producer-${Environment}
      CodeUri: ./crates/kleos-api-producer/
      Description: Accepts events via API Gateway and writes to Kinesis Data Stream
      Environment:
        Variables:
          KINESIS_STREAM_NAME: !Ref KleosKinesisStream
      Policies:
        # Managed policy for CloudWatch Logs
        - AWSLambdaBasicExecutionRole
        # Inline policy for Kinesis write permissions
        - Version: '2012-10-17'
          Statement:
            - Sid: KinesisPutRecordPermission
              Effect: Allow
              Action:
                - kinesis:PutRecord
                - kinesis:PutRecords
              Resource: !GetAtt KleosKinesisStream.Arn
            - Sid: KMSEncryptionPermission
              Effect: Allow
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/kinesis
      Events:
        PostEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref KleosHttpApi
            Path: /events
            Method: POST
      Tags:
        Environment: !Ref Environment
        Application: Kleos

  # ========================================
  # Consumer Lambda (Kinesis -> Processing)
  # ========================================
  KleosStreamConsumer:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: rust-cargolambda
    Properties:
      FunctionName: !Sub kleos-stream-consumer-${Environment}
      CodeUri: ./crates/kleos-stream-consumer/
      Description: Processes events from Kinesis Data Stream
      MemorySize: 512
      Timeout: 60
      Policies:
        # Managed policy: CloudWatch Logs + Kinesis read
        - AWSLambdaKinesisExecutionRole
        # Inline policy for KMS decryption
        - Version: '2012-10-17'
          Statement:
            - Sid: KMSDecryptPermission
              Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/kinesis
            - Sid: SQSSendMessagePermission
              Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt FailedRecordsDLQ.Arn
      Events:
        KinesisEvent:
          Type: Kinesis
          Properties:
            Stream: !GetAtt KleosKinesisStream.Arn
            StartingPosition: LATEST
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 5
            ParallelizationFactor: 1
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            MaximumRecordAgeInSeconds: 604800  # 7 days
            FunctionResponseTypes:
              - ReportBatchItemFailures  # Enable partial batch response
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt FailedRecordsDLQ.Arn
            Enabled: true
      Tags:
        Environment: !Ref Environment
        Application: Kleos

  # ========================================
  # Dead Letter Queue for Failed Records
  # ========================================
  FailedRecordsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub kleos-failed-records-${Environment}
      MessageRetentionPeriod: 1209600  # 14 days
      VisibilityTimeout: 300
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: Kleos

  # ========================================
  # CloudWatch Log Groups with Retention
  # ========================================
  ApiProducerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/kleos-api-producer-${Environment}
      RetentionInDays: !FindInMap [EnvironmentConfig, !Ref Environment, LogRetentionDays]

  StreamConsumerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/kleos-stream-consumer-${Environment}
      RetentionInDays: !FindInMap [EnvironmentConfig, !Ref Environment, LogRetentionDays]

  # ========================================
  # CloudWatch Alarms (Staging/Prod Only)
  # ========================================
  ProducerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: EnableAlarms
    Properties:
      AlarmName: !Sub kleos-producer-errors-${Environment}
      AlarmDescription: Alert when producer Lambda error rate exceeds threshold
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref KleosApiProducer
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ConsumerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: EnableAlarms
    Properties:
      AlarmName: !Sub kleos-consumer-errors-${Environment}
      AlarmDescription: Alert when consumer Lambda error rate exceeds threshold
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref KleosStreamConsumer
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  KinesisIteratorAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: EnableAlarms
    Properties:
      AlarmName: !Sub kleos-kinesis-lag-${Environment}
      AlarmDescription: Alert when Kinesis processing is lagging behind
      MetricName: GetRecords.IteratorAgeMilliseconds
      Namespace: AWS/Kinesis
      Dimensions:
        - Name: StreamName
          Value: !Ref KleosKinesisStream
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 60000  # 60 seconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  DLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: EnableAlarms
    Properties:
      AlarmName: !Sub kleos-dlq-depth-${Environment}
      AlarmDescription: Alert when dead letter queue has messages
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FailedRecordsDLQ.QueueName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

# ========================================
# Outputs for Easy Reference
# ========================================
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL for event ingestion
    Value: !Sub https://${KleosHttpApi}.execute-api.${AWS::Region}.amazonaws.com
    Export:
      Name: !Sub ${AWS::StackName}-ApiEndpoint

  ApiId:
    Description: API Gateway ID
    Value: !Ref KleosHttpApi
    Export:
      Name: !Sub ${AWS::StackName}-ApiId

  KinesisStreamArn:
    Description: Kinesis Stream ARN
    Value: !GetAtt KleosKinesisStream.Arn
    Export:
      Name: !Sub ${AWS::StackName}-StreamArn

  KinesisStreamName:
    Description: Kinesis Stream Name
    Value: !Ref KleosKinesisStream
    Export:
      Name: !Sub ${AWS::StackName}-StreamName

  ProducerFunctionArn:
    Description: Producer Lambda Function ARN
    Value: !GetAtt KleosApiProducer.Arn
    Export:
      Name: !Sub ${AWS::StackName}-ProducerArn

  ProducerFunctionName:
    Description: Producer Lambda Function Name
    Value: !Ref KleosApiProducer

  ConsumerFunctionArn:
    Description: Consumer Lambda Function ARN
    Value: !GetAtt KleosStreamConsumer.Arn
    Export:
      Name: !Sub ${AWS::StackName}-ConsumerArn

  ConsumerFunctionName:
    Description: Consumer Lambda Function Name
    Value: !Ref KleosStreamConsumer

  DLQUrl:
    Description: Dead Letter Queue URL for failed records
    Value: !Ref FailedRecordsDLQ
    Export:
      Name: !Sub ${AWS::StackName}-DLQUrl

  DLQArn:
    Description: Dead Letter Queue ARN
    Value: !GetAtt FailedRecordsDLQ.Arn
    Export:
      Name: !Sub ${AWS::StackName}-DLQArn
